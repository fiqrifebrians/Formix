<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>FORMIX | Precision Workouts</title>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <!-- Ikon logo lokal -->
            FORMIX
        </div>
    </nav>
    
    <header class="hero">
        <div class="hero-content">
            <h1>MASTER YOUR FORM</h1>
            <p>Sleek, straightforward, and effective. Choose your path to perfection.</p>
        </div>
    </header>
    
    <main>
        <section class="selection-container fade-in">
            <a href="muscle.html" class="card">
                <div class="card-icon">
                    <!-- Ikon lengan/biceps lokal -->
                    <img src="assets/biceps.png" alt="Muscle Icon" style="width: 3rem; height: 3rem;">
                </div>
                <h2>BY MUSCLE</h2>
                <p>Target specific muscle groups</p>
                <div class="card-arrow">
                    <img src="assets/next.png" alt="Go" style="width: 1.5rem; height: 1.5rem;">
                </div>
            </a>
            
            <a href="equipment.html" class="card">
                <div class="card-icon">
                    <!-- Ikon dumbbell lokal -->
                    <img src="assets/dumbbells.png" alt="Equipment Icon" style="width: 3rem; height: 3rem;">
                </div>
                <h2>BY EQUIPMENT</h2>
                <p>Filter by available tools</p>
                <div class="card-arrow">
                    <img src="assets/next.png" alt="Go" style="width: 1.5rem; height: 1.5rem;">
                </div>
            </a>
            
            <a href="workouts.html?category=hiit" class="card">
                <div class="card-icon">
                    <!-- Ikon orang berlari/HIIT lokal -->
                    <img src="assets/tabata.png" alt="HIIT Icon" style="width: 3rem; height: 3rem;">
                </div>
                <h2>HIIT</h2>
                <p>High-Intensity Interval Training</p>
                <div class="card-arrow">
                    <img src="assets/next.png" alt="Go" style="width: 1.5rem; height: 1.5rem;">
                </div>
            </a>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 FORMIX. All Rights Reserved.</p>
    </footer>
</body>
</html>
