<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,800;1,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>FORMIX | Precision Workouts</title>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            FORMIX
        </div>
    </nav>
    
    <header class="hero">
        <div class="hero-content">
            <h1>MASTER YOUR FORM</h1>
            <p>No excuses. Just execution.</p>
        </div>
    </header>
    
    <main>
        <section class="selection-container fade-in">
            <a href="muscle.html" class="card">
                <div class="card-icon">
                    <img src="assets/biceps.png" alt="Muscle Icon">
                </div>
                <h2>BY MUSCLE</h2>
                <p>Target specific muscle groups</p>
                <div class="card-arrow">
                    <img src="assets/next.png" alt="Go">
                </div>
            </a>
            
            <a href="equipment.html" class="card">
                <div class="card-icon">
                    <img src="assets/dumbbells.png" alt="Equipment Icon">
                </div>
                <h2>BY EQUIPMENT</h2>
                <p>Filter by available tools</p>
                <div class="card-arrow">
                    <img src="assets/next.png" alt="Go">
                </div>
            </a>
            
            <a href="workouts.html?category=hiit" class="card">
                <div class="card-icon">
                    <img src="assets/tabata.png" alt="HIIT Icon">
                </div>
                <h2>HIIT</h2>
                <p>High-Intensity Interval Training</p>
                <div class="card-arrow">
                    <img src="assets/next.png" alt="Go">
                </div>
            </a>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 FORMIX. GRIND NEVER STOPS.</p>
    </footer>
</body>
</html>
