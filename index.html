<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- Favicon ditambahkan -->
    <link rel="icon" type="image/png" href="assets/mini-logo.png">
    <title>Formix</title>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            FORMIX
        </div>
        <!-- Opsi Bahasa -->
        <div class="nav-right">
            <div class="lang-switcher">
                <span class="active">EN</span><span class="separator">|</span><span>ID</span>
            </div>
        </div>
    </nav>
    
    <header class="hero">
        <div class="hero-content">
            <h1>MASTER YOUR FORM</h1>
            <!-- Penjelasan singkat & Widget UI -->
            <p>The ultimate visual database for precision gym movements.</p>
            <div class="db-widget">
                <div class="db-stat"><span class="db-number">80+</span><span class="db-label">Exercises</span></div>
                <div class="db-stat"><span class="db-number">100%</span><span class="db-label">Visual Form</span></div>
            </div>
        </div>
    </header>
    
    <main>
        <section class="selection-container fade-in">
            <a href="muscle.html" class="card">
                <div class="card-icon">
                    <img src="assets/biceps.png" alt="Muscle Icon" style="width: 3.5rem; height: 3.5rem; object-fit: contain;">
                </div>
                <h2>BY MUSCLE</h2>
                <p>Target specific muscle groups</p>
                <div class="card-arrow">
                    <img src="assets/next.png" alt="Go" style="width: 1.5rem; height: 1.5rem; filter: invert(1);">
                </div>
            </a>
            
            <a href="equipment.html" class="card">
                <div class="card-icon">
                    <img src="assets/dumbbells.png" alt="Equipment Icon" style="width: 3.5rem; height: 3.5rem; object-fit: contain;">
                </div>
                <h2>BY EQUIPMENT</h2>
                <p>Filter by available tools</p>
                <div class="card-arrow">
                    <img src="assets/next.png" alt="Go" style="width: 1.5rem; height: 1.5rem; filter: invert(1);">
                </div>
            </a>
            
            <a href="workouts.html?category=cardio" class="card">
                <div class="card-icon">
                    <img src="assets/tabata.png" alt="Cardio Icon" style="width: 3.5rem; height: 3.5rem; object-fit: contain;">
                </div>
                <h2>CARDIO</h2>
                <p>Endurance & Heart Rate Training</p>
                <div class="card-arrow">
                    <img src="assets/next.png" alt="Go" style="width: 1.5rem; height: 1.5rem; filter: invert(1);">
                </div>
            </a>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 FORMIX. All Rights Reserved.</p>
    </footer>
</body>
</html>
