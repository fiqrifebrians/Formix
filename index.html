<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>FORMIX | Precision Workouts</title>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="assets/icons/logo.svg" alt="Formix Logo" style="width: 1.5rem; height: 1.5rem; margin-right: 0.5rem; vertical-align: middle;" onerror="this.style.display='none'"> 
            FORMIX
        </div>
    </nav>

    <main>
        <section class="selection-container fade-in">
            <a href="muscle.html" class="card">
                <div class="card-icon">
                    <img src="assets/icons/biceps.svg" alt="Muscle Icon" style="width: 3rem; height: 3rem;" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'50\\' height=\\'50\\'><circle cx=\\'25\\' cy=\\'25\\' r=\\'20\\' fill=\\'%23ccc\\'/></svg>'">
                </div>
                <h2>BY MUSCLE</h2>
                <p>Target specific muscle groups</p>
                <div class="card-arrow">
                    <img src="assets/icons/arrow-right.svg" alt="Go" style="width: 1.5rem; height: 1.5rem;" onerror="this.style.display='none'">
                </div>
            </a>
            
            <a href="equipment.html" class="card">
                <div class="card-icon">
                    <img src="assets/icons/dumbbell.svg" alt="Equipment Icon" style="width: 3rem; height: 3rem;" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'50\\' height=\\'50\\'><rect x=\\'10\\' y=\\'20\\' width=\\'30\\' height=\\'10\\' fill=\\'%23ccc\\'/></svg>'">
                </div>
                <h2>BY EQUIPMENT</h2>
                <p>Filter by available tools</p>
                <div class="card-arrow">
                    <img src="assets/icons/arrow-right.svg" alt="Go" style="width: 1.5rem; height: 1.5rem;" onerror="this.style.display='none'">
                </div>
            </a>
            
            <a href="workouts.html?category=cardio" class="card">
                <div class="card-icon">
                    <img src="assets/icons/runner.svg" alt="Cardio Icon" style="width: 3rem; height: 3rem;" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'50\\' height=\\'50\\'><polygon points=\\'25,5 45,45 5,45\\' fill=\\'%23ccc\\'/></svg>'">
                </div>
                <h2>CARDIO</h2>
                <p>Endurance & Heart Rate Training</p>
                <div class="card-arrow">
                    <img src="assets/icons/arrow-right.svg" alt="Go" style="width: 1.5rem; height: 1.5rem;" onerror="this.style.display='none'">
                </div>
            </a>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 FORMIX. All Rights Reserved.</p>
    </footer>
</body>
</html>
