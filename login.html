<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="assets/mini-logo.png">
    <title>Formix - Login</title>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo"><img src="assets/mini-logo.png"> FORMIX</a>
        <div class="nav-right">
            <div class="lang-dropdown"><div class="lang-dropbtn"><span id="current-flag">🇬🇧</span> <span id="current-lang">EN</span> &#9662;</div><div class="lang-dropdown-content"><a href="javascript:void(0)" onclick="setLanguage('en')">🇬🇧 English</a><a href="javascript:void(0)" onclick="setLanguage('id')">🇮🇩 Indonesia</a></div></div>
        </div>
    </nav>
    <main style="display:flex; justify-content:center; align-items:center;">
        <div class="auth-container fade-in">
            <h2 data-i18n="auth_login">LOGIN</h2>
            <form onsubmit="handleLogin(event)">
                <div class="form-group"><label>Username</label><input type="text" id="log-user" required></div>
                <div class="form-group"><label>Password</label><input type="password" id="log-pass" required></div>
                <button type="submit" class="btn-primary" style="width:100%" data-i18n="auth_login">LOGIN</button>
            </form>
            <a href="signup.html" class="auth-link" data-i18n="auth_no_acc">Don't have an account? Sign up</a>
        </div>
    </main>
    <script src="js/lang.js"></script><script src="js/auth.js"></script>
</body>
</html>
