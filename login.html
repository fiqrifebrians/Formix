<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="assets/mini-logo.png">
    <title>Formix - Login</title>
</head>
<body>
    <nav class="navbar"><a href="index.html" class="logo">FORMIX</a><div class="nav-right"><div class="lang-dropdown"><div class="lang-dropbtn"><span id="current-flag">🇬🇧</span> <span id="current-lang">EN</span> &#9662;</div><div class="lang-dropdown-content"><a href="javascript:void(0)" onclick="setLanguage('en')">🇬🇧 English</a><a href="javascript:void(0)" onclick="setLanguage('id')">🇮🇩 Indonesia</a></div></div></div></nav>
    <main style="display:flex; justify-content:center; align-items:center;">
        <div class="auth-container fade-in">
            <h2 data-i18n="auth_login">LOGIN</h2>
            <form onsubmit="handleLogin(event)">
                <div class="form-group"><label>Username</label><input type="text" id="log-user" required></div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="pwd-wrapper">
                        <input type="password" id="log-pass" required>
                        <button type="button" class="pwd-toggle" id="toggle-log-pass" onclick="togglePassword('log-pass', 'toggle-log-pass')">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-primary" style="width:100%" data-i18n="auth_login">LOGIN</button>
            </form>
            <a href="signup.html" class="auth-link" data-i18n="auth_no_acc">Don't have an account? Sign up</a>
        </div>
    </main>
    <script src="js/lang.js"></script><script src="js/auth.js"></script>
</body>
</html>
