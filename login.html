<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Formix - Login</title>
</head>
<body>
    <nav class="navbar"><a href="index.html" class="logo">FORMIX</a></nav>
    <main style="display:flex; justify-content:center; align-items:center; gap: 2rem; flex-wrap:wrap;">
        
        <div class="auth-container fade-in">
            <h2>LOGIN</h2>
            <form onsubmit="handleLogin(event)">
                <div class="form-group"><label>Username</label><input type="text" id="log-user" required></div>
                <div class="form-group"><label>Password</label><input type="password" id="log-pass" required></div>
                <button type="submit" class="btn-primary" style="width:100%">LOGIN</button>
            </form>
            <button onclick="googleAuth()" class="google-btn">🌐 Sign in with Google</button>
        </div>

        <div class="auth-container fade-in" style="animation-delay: 0.1s;">
            <h2>SIGN UP</h2>
            <form onsubmit="handleSignup(event)">
                <div class="form-group"><label>Username</label><input type="text" id="sign-user" required></div>
                <div class="form-group"><label>Password</label><input type="password" id="sign-pass" required></div>
                <button type="submit" class="btn-primary" style="width:100%">SIGN UP</button>
            </form>
        </div>

    </main>
    <script src="js/lang.js"></script><script src="js/auth.js"></script>
</body>
</html>
