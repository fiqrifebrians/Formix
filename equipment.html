<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <title>FORMIX | Equipment</title>
    <style>
        :root { --black: #050505; --white: #ffffff; --gray-light: #f4f4f5; --gray-border: #e4e4e7; --gray-text: #71717a; --font-main: 'Inter', sans-serif; }
        * { box-sizing: border-box; }
        body { font-family: var(--font-main); background-color: var(--gray-light); color: var(--black); margin: 0; padding: 0; line-height: 1.6; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 2rem; background-color: var(--white); border-bottom: 1px solid var(--gray-border); position: sticky; top: 0; z-index: 100; }
        .logo { font-weight: 800; font-size: 1.5rem; letter-spacing: -0.5px; display: flex; align-items: center; gap: 0.5rem; }
        .back-link { text-decoration: none; color: var(--black); font-weight: 800; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem; background-color: var(--gray-light); border-radius: 5px; transition: all 0.3s; }
        .back-link:hover { background-color: var(--black); color: var(--white); }
        .page-header { text-align: center; padding: 4rem 1rem; background-color: var(--white); border-bottom: 1px solid var(--gray-border); }
        .page-header h1 { font-weight: 800; font-size: 3rem; margin: 0; letter-spacing: -1px; text-transform: uppercase; }
        .page-header p { color: var(--gray-text); font-size: 1.1rem; margin-top: 1rem; }
        main { padding: 4rem 2rem; max-width: 1200px; margin: 0 auto; min-height: 50vh; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem; }
        .card { background-color: var(--white); padding: 3rem 2rem; border: 1px solid var(--gray-border); text-align: left; text-decoration: none; color: var(--black); display: flex; flex-direction: column; transition: all 0.3s ease; position: relative; box-shadow: 4px 4px 0px var(--gray-border); cursor: pointer; }
        .card:hover { transform: translate(-4px, -4px); box-shadow: 8px 8px 0px var(--black); border-color: var(--black); }
        .card h2 { font-weight: 800; font-size: 1.5rem; margin: 0 0 0.5rem 0; text-transform: uppercase; }
        .card-arrow { position: absolute; bottom: 2rem; right: 2rem; font-size: 1.5rem; opacity: 0; transform: translateX(-10px); transition: all 0.3s ease; font-weight: bold; }
        .card:hover .card-arrow { opacity: 1; transform: translateX(0); }
        .fade-in { animation: fadeIn 0.6s ease-out forwards; opacity: 0; transform: translateY(20px); }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo" onclick="location.href='index.html'" style="cursor:pointer;">
            FORMIX
        </div>
        <a href="index.html" class="back-link">&larr; Home</a>
    </nav>
    
    <header class="page-header">
        <h1>AVAILABLE EQUIPMENT</h1>
        <p>What do you have access to?</p>
    </header>

    <main>
        <div id="equipment-list" class="grid-container fade-in">
            <!-- Populated by JS -->
        </div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", renderEquipmentList);
    </script>
</body>
</html>
