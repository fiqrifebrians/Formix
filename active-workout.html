<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="assets/mini-logo.png">
    <title>Formix - Active Session</title>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">FORMIX</a>
        <a href="#" onclick="attemptExit(event)" class="btn-primary btn-danger" style="margin:0; box-shadow:none;">&larr; LEAVE SESSION</a>
    </nav>
    
    <div style="padding: 1.5rem 2rem 0; max-width: 800px; margin: 0 auto;">
        <div style="display:flex; justify-content:space-between; font-weight:900; color:var(--black); margin-bottom:5px;">
            <span>PROGRESS</span>
            <span id="progress-text">0%</span>
        </div>
        <div class="progress-container"><div class="progress-bar" id="progress-fill"></div></div>
    </div>

    <main style="padding-top: 1rem; display:flex; flex-direction:column; align-items:center;">
        <div class="active-workout-display fade-in" style="width: 100%; max-width: 800px;">
            <div id="aw-media-container" style="margin-bottom: 2rem;">
                <img id="aw-img" src="" style="width:100%; max-height:400px; object-fit:contain; border:2px solid var(--black); border-radius: 0; box-shadow: 4px 4px 0px var(--black);">
            </div>
            <h2 id="aw-name" class="active-exercise-name">LOADING...</h2>
            <div id="aw-target" class="active-exercise-target" style="border-radius:0;">--</div>
            
            <div id="active-controls" class="active-controls-panel">
                <!-- Injeksi JS -->
            </div>
            
            <div style="display:flex; justify-content:center; gap: 1rem; margin-top:2rem;">
                <button class="btn-primary" id="btn-prev" onclick="navExercise(-1)" disabled style="background:var(--gray-text); border-color:var(--gray-text);">&larr; PREVIOUS</button>
                <button class="btn-primary" id="btn-next" onclick="navExercise(1)">NEXT EXERCISE &rarr;</button>
                <button class="btn-primary btn-success" id="btn-finish" style="display:none; width:100%; font-size:1.2rem; padding:1.2rem;" onclick="completeWorkout()">COMPLETE WORKOUT ✓</button>
            </div>
        </div>
    </main>

    <!-- MODAL PERINGATAN KELUAR -->
    <div id="exitModal" class="modal">
        <div class="modal-content text-center">
            <h2 style="color:var(--black);">WAIT!</h2>
            <p style="font-weight:800; font-size:1.2rem;">You haven't finished your session.</p>
            <p>Are you sure you want to leave and save this workout as incomplete in your history log?</p>
            <div class="modal-actions">
                <button class="btn-primary btn-danger" onclick="confirmExit()">YES, LEAVE</button>
                <button class="btn-primary" onclick="closeExitModal()">CANCEL</button>
            </div>
        </div>
    </div>

    <!-- MODAL FINISH -->
    <div id="finishModal" class="modal">
        <div class="modal-content text-center">
            <h2 style="font-size:2.5rem; border-bottom:3px solid var(--black);">OUTSTANDING!</h2>
            <p style="font-size:1.1rem; color:var(--black); font-weight:800; margin-top:1.5rem;">You have successfully conquered all exercises in this routine.</p>
            <button class="btn-primary btn-success" onclick="window.location.href='workout-log.html'" style="margin-top:2rem; width:100%; font-size:1.1rem;">SAVE & RETURN TO LOG</button>
        </div>
    </div>

    <script src="js/db/muscles.js"></script><script src="js/db/upper.js"></script><script src="js/db/lower.js"></script><script src="js/db/cardio.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/active-workout.js"></script>
</body>
</html>
