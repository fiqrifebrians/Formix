<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="assets/mini-logo.png">
    <title>Formix - Active Session</title>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo"><img src="assets/mini-logo.png"> FORMIX</a>
        <!-- Custom Back Button Intercept -->
        <a href="#" onclick="attemptExit(event)" class="header-back-btn" style="position:static; border:none; box-shadow:none; padding:0;">&larr; LEAVE SESSION</a>
    </nav>
    
    <!-- PROGRESS BAR -->
    <div style="padding: 0 2rem; max-width: 1000px; margin: 0 auto;">
        <div class="progress-container">
            <div class="progress-bar" id="progress-fill"></div>
        </div>
        <div style="text-align: right; font-weight: 900; color: var(--primary);" id="progress-text">0%</div>
    </div>

    <main style="padding-top: 1rem; display:flex; flex-direction:column; align-items:center;">
        
        <div class="active-workout-display fade-in" style="width: 100%; max-width: 800px;">
            <div id="aw-media-container" style="margin-bottom: 2rem;">
                <img id="aw-img" src="" style="width:100%; max-height:400px; object-fit:contain; border-radius:8px;">
            </div>
            
            <h2 id="aw-name" class="active-exercise-name">LOADING...</h2>
            <div id="aw-target" class="active-exercise-target">--</div>
            
            <div style="display:flex; justify-content:center; gap: 1rem; margin-top:2rem;">
                <button class="btn-primary btn-danger" id="btn-prev" onclick="navExercise(-1)" disabled>&larr; PREVIOUS</button>
                <button class="btn-primary" id="btn-next" onclick="navExercise(1)">NEXT EXERCISE &rarr;</button>
            </div>
            
            <button class="btn-primary btn-success" id="btn-finish" style="display:none; width:100%; margin-top:1rem; font-size:1.2rem; padding:1.2rem;" onclick="completeWorkout()">COMPLETE WORKOUT ✓</button>
        </div>

    </main>

    <!-- MODAL PERINGATAN KELUAR -->
    <div id="exitModal" class="modal">
        <div class="modal-content">
            <h2>WAIT!</h2>
            <p>You haven't finished your session. Are you sure you want to leave and save it as incomplete?</p>
            <div class="modal-actions">
                <button class="btn-primary btn-danger" onclick="confirmExit()">YES, LEAVE</button>
                <button class="btn-primary" onclick="closeExitModal()">CANCEL</button>
            </div>
        </div>
    </div>

    <!-- MODAL FINISH -->
    <div id="finishModal" class="modal">
        <div class="modal-content">
            <h2 style="color:var(--success);">OUTSTANDING!</h2>
            <p>You have successfully completed this routine.</p>
            <button class="btn-primary btn-success" onclick="window.location.href='workout-log.html'" style="width:100%; margin-top:1rem;">SAVE & RETURN TO LOG</button>
        </div>
    </div>

    <script src="js/db/muscles.js"></script><script src="js/db/upper.js"></script><script src="js/db/lower.js"></script><script src="js/db/cardio.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/active-workout.js"></script>
</body>
</html>
