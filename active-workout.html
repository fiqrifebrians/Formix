<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="assets/mini-logo.png">
    <title>Formix - Active Workout</title>
</head>
<body>
    <nav class="navbar"><a href="index.html" class="logo">FORMIX</a><div class="nav-right"><div class="lang-dropdown"><div class="lang-dropbtn"><span id="current-flag">🇬🇧</span> <span id="current-lang">EN</span> &#9662;</div><div class="lang-dropdown-content"><a href="javascript:void(0)" onclick="setLanguage('en')">🇬🇧 English</a><a href="javascript:void(0)" onclick="setLanguage('id')">🇮🇩 Indonesia</a></div></div><div id="auth-container"></div></div></nav>
    <header class="page-header">
        <a href="javascript:history.back()" class="header-back-btn" data-i18n="btn_back">&larr; Back</a>
        <h1 id="active-title">LOADING...</h1>
    </header>
    <main>
        <div class="active-header-actions">
            <button id="btn-start-workout" class="btn-primary" style="background:#16a34a; padding: 1rem 2rem; font-size:1.2rem;" onclick="startWorkout()">START WORKOUT</button>
            <button id="btn-edit-workout" class="btn-primary" style="padding: 1rem 2rem; font-size:1.2rem;" onclick="toggleEditMode()">EDIT WORKOUT</button>
        </div>
        <div id="active-list" class="workout-container"></div>
        <div style="text-align:center; margin-top:2rem;">
            <button id="btn-add-ex" class="btn-primary" style="display:none; font-size:1.2rem;" onclick="openAddModal()">+ ADD EXERCISE</button>
        </div>
    </main>

    <div id="addModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeAddModal()">&times;</span>
            <h2>Add Exercise</h2>
            <div class="form-group" style="background:var(--gray-light); padding:1rem; border:1px solid var(--black);">
                <div class="filter-row">
                    <input type="text" id="filter-name-act" placeholder="Search name..." oninput="filterModalExercisesAct()">
                    <select id="filter-muscle-act" onchange="filterModalExercisesAct()"><option value="all">All Muscles</option></select>
                    <select id="filter-equip-act" onchange="filterModalExercisesAct()"><option value="all">All Equipments</option></select>
                </div>
                <div id="modal-ex-list-act" class="ex-list-modal"></div>
                
                <div id="ex-config-act" style="display:none; margin-top:1rem; padding-top:1rem; border-top:1px solid var(--gray-border);">
                    <h4 id="selected-ex-name-act" style="margin:0 0 0.5rem; color:var(--primary);"></h4>
                    <select id="ex-type-act" onchange="toggleExTypeAct()" style="margin-bottom:0.5rem;">
                        <option value="reps">Repetitions</option>
                        <option value="timer">Timer</option>
                    </select>
                    <div id="reps-config-act" style="display:flex; gap:0.5rem; align-items:center;">
                        <input type="number" id="ex-reps-act" placeholder="Reps"> x 
                        <input type="number" id="ex-rounds-act" placeholder="Rounds">
                    </div>
                    <div id="timer-config-act" style="display:none; gap:0.5rem; align-items:center;">
                        <input type="number" id="ex-timer-act" placeholder="Seconds"> x
                        <input type="number" id="ex-laps-act" placeholder="Laps">
                    </div>
                    <button class="btn-primary" type="button" onclick="addExerciseToActivePlan()" style="margin-top:1rem; width:100%;">+ Add to Routine</button>
                </div>
            </div>
        </div>
    </div>

    <div id="finishModal" class="modal">
        <div class="modal-content text-center">
            <h2 style="font-size:2.5rem; border-bottom:3px solid var(--black); padding-bottom:1rem;">WORKOUT COMPLETED</h2>
            <p style="font-size:1.1rem; color:var(--gray-text); margin-top:1.5rem;">Outstanding effort. You have successfully conquered all exercises in this routine.</p>
            <button class="btn-primary" onclick="window.location.href='my-workout.html'" style="margin-top:2rem; width:100%; font-size:1.1rem;">RETURN TO DASHBOARD</button>
        </div>
    </div>

    <script src="js/db/muscles.js"></script><script src="js/db/upper.js"></script><script src="js/db/lower.js"></script><script src="js/db/cardio.js"></script>
    <script src="js/lang.js"></script><script src="js/auth.js"></script><script src="js/app.js"></script><script src="js/active-workout.js"></script>
</body>
</html>
