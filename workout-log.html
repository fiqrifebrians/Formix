<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="assets/mini-logo.png">
    <title>Formix - Workout Log</title>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo"><img src="assets/mini-logo.png"> FORMIX</a>
        <div class="nav-right"><div id="auth-container"></div></div>
    </nav>
    <header class="page-header">
        <a href="javascript:history.back()" class="header-back-btn">&larr; Back</a>
        <h1>WORKOUT LOG</h1>
        <p>Track your daily consistency and launch your routines.</p>
    </header>
    
    <main style="padding: 0;">
        <div class="dashboard-layout fade-in">
            <!-- SIDEBAR NAVIGASI -->
            <aside class="sidebar">
                <a href="my-workout.html">My Workouts</a>
                <a href="workout-log.html" class="active">Workout Log</a>
            </aside>

            <!-- KONTEN KALENDER -->
            <div class="dashboard-content">
                <div class="log-layout">
                    <!-- KALENDER -->
                    <div class="calendar-container">
                        <div class="cal-header">
                            <button onclick="changeMonth(-1)">&#9664;</button>
                            <span id="month-year-display">JANUARY 2026</span>
                            <button onclick="changeMonth(1)">&#9654;</button>
                        </div>
                        <div class="cal-weekdays">
                            <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
                        </div>
                        <div class="cal-grid" id="calendar-grid">
                            <!-- Injeksi JS -->
                        </div>
                        <div style="margin-top: 2rem; display: flex; gap: 1.5rem; font-size: 0.85rem; font-weight: 800; color: var(--black); justify-content: center; text-transform: uppercase;">
                            <div style="display:flex; align-items:center; gap:8px;"><span style="display:inline-block; width:16px; height:16px; background:var(--warning); border-radius:4px; border:2px solid #92400e;"></span> Logged Activity</div>
                        </div>
                    </div>

                    <!-- PANEL DETAIL (Sinkronisasi Database) -->
                    <div class="log-details-panel">
                        <h3 id="selected-date-title">SELECT A DATE</h3>
                        
                        <div id="history-log-status" style="margin-bottom: 2rem; display:none;">
                            <!-- Injeksi JS Status -->
                        </div>

                        <div id="today-workout-list" style="display:none; flex-direction: column; flex-grow: 1;">
                            <h4 style="color:var(--black); font-weight:900; border-bottom:2px solid var(--black); padding-bottom:0.5rem; margin-bottom:1.5rem; text-transform:uppercase;">LAUNCH ROUTINE</h4>
                            <div id="programs-container" style="overflow-y:auto; flex-grow:1; max-height: 400px; padding-right:5px;">
                                <!-- Injeksi Daftar Workout (Start/Continue) -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>&copy; 2026 FORMIX. All Rights Reserved.</footer>
    
    <script src="js/auth.js"></script>
    <script src="js/workout-log.js"></script>
</body>
</html>
