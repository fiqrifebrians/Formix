<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Formix - Sign Up</title>
</head>
<body>
    <nav class="navbar"><a href="index.html" class="logo">FORMIX</a></nav>
    <main style="display:flex; justify-content:center; align-items:center;">
        <div class="auth-container fade-in">
            <h2 data-i18n="auth_signup">SIGN UP</h2>
            <form onsubmit="handleSignup(event)">
                <div class="form-group"><label>Username</label><input type="text" id="sign-user" required></div>
                <div class="form-group"><label>Password</label><input type="password" id="sign-pass" required></div>
                <button type="submit" class="btn-primary" style="width:100%" data-i18n="auth_signup">SIGN UP</button>
            </form>
            <button onclick="googleAuth()" class="google-btn">🌐 Sign up with Google</button>
            <a href="login.html" class="auth-link" data-i18n="auth_have_acc">I already have an account</a>
        </div>
    </main>
    <script src="js/lang.js"></script><script src="js/auth.js"></script>
</body>
</html>
